<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#05080C">
<meta property="og:type" content="website">
<meta property="og:title" content="PARADOX · 内测邀请">
<meta property="og:description" content="你先别看我说什么，看我读你的单子读出了什么。">
<meta name="description" content="PARADOX 内测邀请 · 交易模式发现器">
<title>PARADOX · 内测邀请</title>
<style>
:root{
  --bg:#05080C;--bg-1:#080C12;--bg-2:#0D131C;--bg-3:#131B26;
  --line:rgba(255,255,255,.08);--line-3:rgba(255,255,255,.14);
  --txt:#E8EDF4;--txt-2:#AEB9C7;--txt-3:#8A97A8;--txt-4:#5A6779;--txt-5:#3E4A5A;
  --gold:#E8C36A;--gold-2:#F0A94A;
  --up:#F04848;--down:#26A69A;
  --r-lg:11px;--r-md:9px;--r-pill:999px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
  font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;
  min-height:100vh;display:flex;align-items:center;justify-content:center;
  padding:32px 20px 44px;
}

/* ===== 背景三层 ===== */
.bgflow,.bgcone,.bgyig{position:fixed;pointer-events:none;z-index:0}
.bgflow{inset:-40%;background:
  radial-gradient(46% 34% at 30% 26%,rgba(232,195,106,.085),transparent 62%),
  radial-gradient(38% 30% at 72% 68%,rgba(110,168,254,.045),transparent 62%);
  animation:drift 26s ease-in-out infinite alternate}
@keyframes drift{0%{transform:translate3d(-2%,-1%,0) scale(1)}100%{transform:translate3d(2%,2%,0) scale(1.08)}}
.bgcone{inset:-30%;background:conic-gradient(from 0deg at 50% 50%,
  transparent 0deg,rgba(232,195,106,.05) 42deg,transparent 92deg,
  transparent 180deg,rgba(240,169,74,.035) 226deg,transparent 290deg);
  animation:spin 52s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.bgyig{inset:0;opacity:.5;
  background-image:repeating-linear-gradient(0deg,rgba(255,255,255,.014) 0 1px,transparent 1px 3px);}
@media (prefers-reduced-motion:reduce){
  .bgflow,.bgcone{animation:none}
}

/* ===== 卡片 ===== */
.card{
  position:relative;z-index:1;width:100%;max-width:430px;
  background:linear-gradient(180deg,rgba(19,27,38,.92),rgba(8,12,18,.96));
  border:1px solid var(--line);border-radius:20px;
  padding:34px 24px 24px;
  box-shadow:0 28px 70px -30px rgba(0,0,0,.92),0 0 0 1px rgba(232,195,106,.05) inset;
  animation:rise .8s cubic-bezier(.22,.7,.2,1) both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* ===== LOGO ===== */
.mark{display:flex;align-items:center;gap:10px;margin-bottom:26px}
.mark svg{width:26px;height:26px;flex:none}
.mark .wm{font-size:15px;font-weight:650;letter-spacing:.30em;color:var(--txt)}
.mark .tag{margin-left:auto;font-size:9.5px;letter-spacing:.16em;color:var(--gold);
  border:1px solid rgba(232,195,106,.26);border-radius:var(--r-pill);padding:3px 9px;
  text-transform:uppercase;animation:breathe 4.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:.62}50%{opacity:1}}

/* ===== 主标题 ===== */
h1{font-size:25px;line-height:1.42;font-weight:680;letter-spacing:-.01em;margin-bottom:14px}
h1 em{font-style:normal;color:var(--gold);position:relative;white-space:nowrap}
h1 em::after{content:'';position:absolute;left:0;right:0;bottom:1px;height:1.5px;
  background:var(--gold);transform-origin:left;transform:scaleX(0);
  animation:strike .9s .7s cubic-bezier(.6,.05,.2,1) forwards}
@keyframes strike{to{transform:scaleX(1)}}

.sub{font-size:14px;line-height:1.85;color:var(--txt-3);margin-bottom:26px}
.sub b{color:var(--txt-2);font-weight:560}

/* ===== 两条路 ===== */
.paths{display:flex;flex-direction:column;gap:11px;margin-bottom:20px}
.path{
  display:block;text-decoration:none;color:inherit;
  background:rgba(255,255,255,.028);
  border:1px solid var(--line);border-radius:var(--r-lg);
  padding:16px 17px;position:relative;overflow:hidden;
  transition:border-color .28s,background .28s,transform .18s;
}
.path:hover,.path:active{border-color:rgba(232,195,106,.34);background:rgba(232,195,106,.045);transform:translateY(-1px)}
.path .top{display:flex;align-items:center;gap:9px;margin-bottom:7px}
.path .idx{font-size:9.5px;letter-spacing:.14em;color:var(--gold);opacity:.75}
.path .ttl{font-size:15.5px;font-weight:640;letter-spacing:-.005em}
.path .arrow{margin-left:auto;color:var(--txt-4);font-size:15px;transition:transform .28s,color .28s}
.path:hover .arrow{transform:translateX(3px);color:var(--gold)}
.path .desc{font-size:12.5px;line-height:1.75;color:var(--txt-3)}
.path .desc .hi{color:var(--txt-2)}
.path.primary{border-color:rgba(232,195,106,.30);
  background:linear-gradient(180deg,rgba(232,195,106,.075),rgba(232,195,106,.022))}
.path.primary .ttl{color:var(--gold)}

/* ===== 底部 ===== */
.foot{font-size:11.5px;line-height:1.9;color:var(--txt-4);
  border-top:1px solid var(--line);padding-top:16px}
.foot .kv{display:flex;gap:8px;align-items:flex-start}
.foot .k{color:var(--txt-5);flex:none;width:52px}
.foot .lock{color:var(--gold);opacity:.8}

@media (max-width:360px){
  .card{padding:28px 18px 20px;border-radius:17px}
  h1{font-size:22px}
  .path{padding:14px 14px}
}
</style>
</head>
<body>
<div class="bgflow"></div><div class="bgcone"></div><div class="bgyig"></div>

<main class="card">

  <div class="mark">
    <svg viewBox="0 0 40 40" fill="none" aria-hidden="true">
      <path d="M11 32V9h8.4c3.9 0 6.6 2.4 6.6 6.1 0 3.8-2.7 6.2-6.6 6.2H15" stroke="#E8C36A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M22 20.6 29 32" stroke="#E8C36A" stroke-width="2.6" stroke-linecap="round" opacity=".60"/>
      <circle cx="29.4" cy="10.6" r="2.5" stroke="#F0A94A" stroke-width="2" opacity=".9"/>
    </svg>
    <span class="wm">PARADOX</span>
    <span class="tag">内测中</span>
  </div>

  <h1>你先别看我说什么，<br>看我<em>读你的单子</em>读出了什么。</h1>

  <p class="sub">
    这里有两样东西。<b>第一样是话</b>——我为什么做这个东西。<br>
    <b>第二样是证据</b>——一份真实报告长什么样。
  </p>

  <nav class="paths">
    <a class="path primary" href="./hero.html">
      <span class="top">
        <span class="idx">01</span>
        <span class="ttl">先看这个 · 我为什么做它</span>
        <span class="arrow">→</span>
      </span>
      <span class="desc">一句话：<span class="hi">你不知道自己，一直重复同一个错。</span><br>读完约 90 秒。</span>
    </a>

    <a class="path" href="./report.html">
      <span class="top">
        <span class="idx">02</span>
        <span class="ttl">再看这个 · 报告长什么样</span>
        <span class="arrow">→</span>
      </span>
      <span class="desc">一份<b>完整样例</b>（不是截图，能上下滚）。<br>看看它能不能读出你自己。</span>
    </a>
  </nav>

  <div class="foot">
    <div class="kv"><span class="k">说明</span><span>这是<b>内测版</b>，只在小圈子里跑，还在改。</span></div>
    <div class="kv"><span class="k">数据</span><span class="lock">你在这里看到的所有数据，都是演示数据，不是任何人的真实账户。</span></div>
    <div class="kv"><span class="k">下一步</span><span>如果你也想让它读一遍你的单子，直接跟我说。</span></div>
  </div>

</main>

<script>
/* 极简：进来时轻推一下，让首屏动起来（不做视差、不做弹跳） */
document.addEventListener('DOMContentLoaded', function(){
  var c = document.querySelector('.card');
  if (!c) return;
  c.style.animationPlayState = 'running';
});
</script>
</body>
</html>
